# Local stack:  docker compose up --build
# Then seed:    docker compose exec api node src/seed.js
# Shop: http://localhost:3000   API: http://localhost:4000/health
services:
  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: [mongo-data:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      retries: 5

  api:
    build: ./api
    environment:
      NODE_ENV: development
      MONGO_URI: mongodb://mongo:27017/kadai
      CORS_ORIGIN: http://localhost:3000
      JWT_SECRET: local-dev-access
      JWT_REFRESH_SECRET: local-dev-refresh
      # Fill these from api/.env to use Razorpay test mode instead of the mock gateway
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
    ports: ["4000:4000"]
    depends_on:
      mongo: { condition: service_healthy }

  worker:
    build: ./api
    command: ["node", "src/workers/index.js"]
    environment:
      NODE_ENV: development
      MONGO_URI: mongodb://mongo:27017/kadai
      PAYMENT_TIMEOUT_MINUTES: "15"
    depends_on:
      mongo: { condition: service_healthy }

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000
    environment:
      API_URL: http://api:4000
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  mongo-data:
